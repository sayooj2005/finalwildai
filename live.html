<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WildAI - Live Monitoring</title>
    <style>
        :root { --bg: #121212; --panel: #1e1e1e; --border: #333; --text: #eee; --accent: #00C851; --danger: #ff4444; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 15px; height: 100vh; display: flex; flex-direction: column; overflow: hidden; box-sizing: border-box; }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 10px; border-bottom: 2px solid var(--accent); margin-bottom: 15px; flex-shrink: 0; }
        .header h1 { margin: 0; font-size: 1.5em; text-transform: uppercase; letter-spacing: 2px; }
        .header-controls { display: flex; gap: 10px; align-items: center; }
        .header-controls select { padding: 5px; background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 4px; }
        
        .main-layout { display: flex; gap: 15px; flex: 1; min-height: 0; }
        
        /* LEFT: Video Feed */
        .video-container { flex: 3; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
        .video-wrapper { flex: 1; position: relative; display: flex; justify-content: center; align-items: center; background: #000; overflow: hidden; }
        #live-video { max-width: 100%; max-height: 100%; object-fit: contain; }
        .connection-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; align-items: center; background: rgba(0,0,0,0.7); font-weight: bold; font-size: 1.2em; z-index: 10; }
        
        .video-controls { display: flex; gap: 10px; padding: 10px; background: #222; border-top: 1px solid var(--border); }
        .btn { background: #333; color: #fff; border: 1px solid #555; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn:hover { background: #444; }
        .btn.primary { background: var(--accent); border-color: var(--accent); }
        .btn.primary:hover { background: #007e33; }
        
        /* RIGHT: Incident Panel */
        .incident-panel { flex: 1; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 15px; display: flex; flex-direction: column; gap: 15px; overflow-y: auto; }
        .incident-panel h2 { margin: 0 0 10px 0; font-size: 1.2em; border-bottom: 1px solid var(--border); padding-bottom: 5px; color: var(--accent); }
        
        .metric { background: #2c2c2c; padding: 15px; border-radius: 6px; text-align: center; border-left: 4px solid var(--border); }
        .metric h3 { margin: 0 0 5px 0; font-size: 0.85em; color: #aaa; text-transform: uppercase; }
        .metric .value { font-size: 1.8em; font-weight: bold; }
        
        .metric.danger { border-left-color: var(--danger); }
        .metric.danger .value { color: var(--danger); }
        .metric.safe { border-left-color: var(--accent); }
        .metric.safe .value { color: var(--accent); }
        
        /* BOTTOM: Timeline */
        .timeline-container { height: 200px; margin-top: 15px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; display: flex; flex-direction: column; flex-shrink: 0; }
        .timeline-header { padding: 10px 15px; border-bottom: 1px solid var(--border); font-weight: bold; color: var(--accent); }
        .timeline-body { flex: 1; overflow-y: auto; padding: 0; margin: 0; list-style: none; }
        .timeline-item { display: grid; grid-template-columns: 80px 70px 100px 70px 60px 80px auto; gap: 10px; padding: 10px 15px; border-bottom: 1px solid #2a2a2a; align-items: center; font-size: 0.85em; }
        .timeline-item:hover { background: #2a2a2a; }
        .badge { padding: 3px 6px; border-radius: 4px; font-size: 0.8em; font-weight: bold; text-align: center; }
        .badge.critical { background: var(--danger); color: white; }
        .badge.warning { background: #ffbb33; color: #333; }
        .badge.info { background: #33b5e5; color: white; }
        
        /* Toast */
        #toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
        .toast { background: #333; color: #fff; padding: 12px 20px; border-radius: 6px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); animation: slideIn 0.3s ease forwards; pointer-events: auto; font-size: 0.9em; border-left: 4px solid var(--accent); }
        .toast.error { border-left-color: var(--danger); }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        
        /* Responsive */
        @media (max-width: 900px) {
            .main-layout { flex-direction: column; }
            .incident-panel { flex-direction: row; flex-wrap: wrap; }
            .metric { flex: 1; min-width: 120px; }
            .timeline-item { grid-template-columns: 1fr 1fr 1fr; }
        }
        @media (max-width: 600px) {
            .header { flex-direction: column; align-items: flex-start; gap: 10px; }
            .header-controls { width: 100%; justify-content: space-between; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>WILDAI Live Monitor</h1>
        <div class="header-controls">
            <span id="inf-status" style="color: #aaa; margin-right: 15px; font-weight: bold;">[INFERENCE: WAITING]</span>
            <select id="camera-select" onchange="switchCamera()">
                <option value="camera">Primary Camera (CAM_01)</option>
                <option value="thermal">Thermal Sensor (CAM_02)</option>
            </select>
        </div>
    </div>

    <div class="main-layout">
        <!-- LEFT -->
        <div class="video-container" id="video-box">
            <div class="video-wrapper" id="video-wrapper">
                <div class="connection-overlay" id="connection-overlay">CONNECTING TO VIDEO STREAM...</div>
                <img id="live-video" style="display: none;" />
            </div>
            <div class="video-controls">
                <button class="btn" id="btn-pause" onclick="togglePause()">Pause</button>
                <button class="btn" onclick="takeSnapshot()">Snapshot</button>
                <button class="btn" onclick="toggleFullscreen()">Fullscreen</button>
            </div>
        </div>
        
        <!-- RIGHT -->
        <div class="incident-panel">
            <h2>Live Telemetry</h2>
            <div class="metric" id="m-detections">
                <h3>Active Detections</h3>
                <div class="value">0</div>
            </div>
            <div class="metric" id="m-tracks">
                <h3>Active Tracks</h3>
                <div class="value">0</div>
            </div>
            <div class="metric safe" id="m-risk">
                <h3>Highest Risk Score</h3>
                <div class="value">0</div>
            </div>
            <div class="metric safe" id="m-human">
                <h3>Human Presence</h3>
                <div class="value">NO</div>
            </div>
            <div class="metric safe" id="m-alert">
                <h3>Alert Status</h3>
                <div class="value">NORMAL</div>
            </div>
        </div>
    </div>

    <!-- BOTTOM -->
    <div class="timeline-container">
        <div class="timeline-header">Event Timeline</div>
        <ul class="timeline-body" id="timeline">
            <!-- Items injected by JS -->
        </ul>
    </div>

    <div id="toast-container"></div>

    <script>
        let ws;
        let isPaused = false;
        let lastFrameUrl = null;
        let knownTracks = new Set();
        
        function showToast(msg, isError=false) {
            const container = document.getElementById('toast-container');
            const el = document.createElement('div');
            el.className = 'toast' + (isError ? ' error' : '');
            el.innerText = msg;
            container.appendChild(el);
            setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, 3000);
        }
        
        function connect() {
            const cam = document.getElementById('camera-select').value;
            const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${wsProtocol}//${window.location.host}/ws/stream/${cam}`);
            
            ws.onopen = () => {
                document.getElementById('connection-overlay').style.display = 'none';
                document.getElementById('live-video').style.display = 'block';
                document.getElementById('inf-status').innerText = '[INFERENCE: ACTIVE]';
                document.getElementById('inf-status').style.color = '#00C851';
                showToast("Connected to live telemetry stream");
            };
            
            ws.onclose = () => {
                document.getElementById('connection-overlay').style.display = 'flex';
                document.getElementById('connection-overlay').innerText = 'CONNECTION LOST. RECONNECTING...';
                document.getElementById('live-video').style.display = 'none';
                document.getElementById('inf-status').innerText = '[INFERENCE: OFFLINE]';
                document.getElementById('inf-status').style.color = '#ff4444';
                showToast("Connection to backend lost", true);
                setTimeout(connect, 3000);
            };
            
            ws.onmessage = (event) => {
                if (isPaused) return;

                if (typeof event.data === 'string') {
                    // Telemetry / Alerts
                    const data = JSON.parse(event.data);
                    if (data.action === "telemetry") {
                        updateTelemetry(data);
                    } else if (data.action === "alert") {
                        addTimelineEvent(data);
                    }
                } else {
                    // Binary Video Frame
                    const blob = new Blob([event.data], { type: 'image/jpeg' });
                    const url = URL.createObjectURL(blob);
                    
                    const img = document.getElementById('live-video');
                    img.onload = () => URL.revokeObjectURL(lastFrameUrl);
                    img.src = url;
                    lastFrameUrl = url;
                }
            };
        }
        
        function updateTelemetry(data) {
            document.querySelector('#m-detections .value').innerText = data.active_detections;
            document.querySelector('#m-tracks .value').innerText = data.active_tracks;
            
            const riskEl = document.getElementById('m-risk');
            riskEl.querySelector('.value').innerText = data.highest_risk;
            if (data.highest_risk > 75) { riskEl.className = 'metric danger'; }
            else if (data.highest_risk > 40) { riskEl.className = 'metric warning'; }
            else { riskEl.className = 'metric safe'; }
            
            const humanEl = document.getElementById('m-human');
            humanEl.querySelector('.value').innerText = data.human_presence ? "DETECTED" : "NO";
            humanEl.className = data.human_presence ? 'metric danger' : 'metric safe';
            
            const alertEl = document.getElementById('m-alert');
            const alertState = (data.highest_risk > 75 || data.human_presence) ? "ELEVATED" : "NORMAL";
            alertEl.querySelector('.value').innerText = alertState;
            alertEl.className = alertState === "ELEVATED" ? 'metric danger' : 'metric safe';

            // Extract distinct events from telemetry to timeline
            data.threats.forEach(t => {
                if (!knownTracks.has(t.track_id)) {
                    knownTracks.add(t.track_id);
                    addTimelineEvent({
                        species: t.species,
                        confidence: "N/A",
                        danger_level: t.danger || "info",
                        risk_score: t.risk_score || 0,
                        behaviour: t.behaviour || "Entered zone",
                        track_id: t.track_id
                    });
                }
            });
        }
        
        function addTimelineEvent(eventData) {
            const tl = document.getElementById('timeline');
            const li = document.createElement('li');
            li.className = 'timeline-item';
            
            const time = new Date().toLocaleTimeString();
            let badgeClass = 'info';
            if (eventData.danger_level === 'high' || eventData.danger_level === 'critical') badgeClass = 'critical';
            else if (eventData.danger_level === 'medium' || eventData.danger_level === 'warning') badgeClass = 'warning';
            
            const trkId = eventData.track_id || `ID-${Math.floor(Math.random()*1000)}`;

            li.innerHTML = `
                <div>${time}</div>
                <div>CAM_01</div>
                <div style="text-transform: capitalize; font-weight: bold;">${eventData.species}</div>
                <div>#${trkId}</div>
                <div>${eventData.confidence || "N/A"}</div>
                <div><span class="badge ${badgeClass}">Risk: ${eventData.risk_score || '-'}</span></div>
                <div>${eventData.behaviour || "Detected"}</div>
            `;
            tl.prepend(li);
            
            // Limit timeline size
            if (tl.children.length > 50) tl.removeChild(tl.lastChild);
        }
        
        function togglePause() {
            isPaused = !isPaused;
            const btn = document.getElementById('btn-pause');
            btn.innerText = isPaused ? "Resume" : "Pause";
            btn.className = isPaused ? "btn primary" : "btn";
        }
        
        function takeSnapshot() {
            if (!lastFrameUrl) return;
            const a = document.createElement('a');
            a.href = lastFrameUrl;
            a.download = `wildai-snapshot-${new Date().getTime()}.jpg`;
            a.click();
        }
        
        function toggleFullscreen() {
            const vBox = document.getElementById('video-box');
            if (!document.fullscreenElement) {
                vBox.requestFullscreen().catch(err => {
                    alert(`Error attempting to enable fullscreen mode: ${err.message} (${err.name})`);
                });
            } else {
                document.exitFullscreen();
            }
        }
        
        function switchCamera() {
            ws.close();
            // The onclose event handles the reconnect automatically with the new select value
        }

        // Start
        connect();
    </script>
</body>
</html>
