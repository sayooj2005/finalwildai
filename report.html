<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WildAI - Community Wildlife Reporting</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif; background-color: #faf8f2; color: #18221b; margin: 0; padding: 25px 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(10, 28, 18, 0.08); border: 1px solid #e2ddd0; }
        h1 { color: #133321; font-family: 'Barlow', sans-serif; text-align: center; margin-top: 0; border-bottom: 2px solid #c78629; padding-bottom: 12px; font-size: 1.75rem; letter-spacing: 0.02em; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; color: #18221b; font-size: 0.9rem; }
        input[type="text"], textarea { width: 100%; padding: 11px 14px; border: 1px solid #d5cfbf; border-radius: 8px; box-sizing: border-box; font-family: inherit; }
        input[type="text"]:focus, textarea:focus { border-color: #c78629; outline: none; }
        input[type="file"] { display: none; }
        .file-btn { display: inline-block; background: #133321; color: #fff; padding: 12px 18px; border-radius: 8px; cursor: pointer; text-align: center; font-weight: 600; width: 100%; box-sizing: border-box; transition: background 0.2s; }
        .file-btn:hover { background: #1e4a32; }
        #preview { width: 100%; max-height: 300px; object-fit: contain; margin-top: 10px; display: none; border: 1px solid #d5cfbf; border-radius: 8px; }
        .submit-btn { background: linear-gradient(135deg, #c78629, #aa6c1b); color: #fff; padding: 14px; border: none; border-radius: 8px; cursor: pointer; font-weight: 700; width: 100%; font-size: 1.05rem; margin-top: 12px; transition: transform 0.2s, box-shadow 0.2s; letter-spacing: 0.04em; }
        .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(170, 108, 27, 0.35); }
        .gps-btn { background: #3a492f; color: #fff; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; margin-top: 6px; font-weight: 600; }
        .gps-btn:hover { background: #133321; }
        
        #result-box { display: none; margin-top: 20px; padding: 16px; border-radius: 8px; background: #f3f8f4; border: 1px solid #c3dec8; }
        .result-title { font-weight: 700; color: #1e4a32; font-size: 1.1em; margin-bottom: 10px; }
        .loader { display: none; text-align: center; margin-top: 15px; font-weight: 600; color: #c78629; }
    </style>
</head>
<body>

<div class="container">
    <h1>Report Wildlife Sighting</h1>
    
    <form id="reportForm">
        <div class="form-group">
            <label>1. Photo Evidence</label>
            <label class="file-btn" for="image">Take Photo or Upload Image</label>
            <input type="file" id="image" name="image" accept="image/*" capture="environment" required onchange="previewImage(event)">
            <img id="preview" alt="Image preview">
        </div>

        <div class="form-group">
            <label>2. Location</label>
            <input type="text" id="location" name="location" placeholder="E.g., Near Sector 4 water tower" required>
            <button type="button" class="gps-btn" onclick="getGPS()">Use Current GPS Location</button>
            <input type="hidden" id="lat" name="lat">
            <input type="hidden" id="lon" name="lon">
        </div>

        <div class="form-group">
            <label>3. Optional Description</label>
            <textarea id="description" name="description" rows="3" placeholder="Describe animal behavior or any risks..."></textarea>
        </div>

        <button type="submit" class="submit-btn" id="submitBtn">Submit Report</button>
        <div class="loader" id="loader">Processing AI Image Analysis... Please wait.</div>
    </form>

    <div id="result-box">
        <div class="result-title">Report Submitted Successfully!</div>
        <div id="result-content"></div>
    </div>
</div>

<script>
    function previewImage(event) {
        const preview = document.getElementById('preview');
        const file = event.target.files[0];
        if (file) {
            preview.src = URL.createObjectURL(file);
            preview.style.display = 'block';
        }
    }

    function getGPS() {
        if ("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition((pos) => {
                document.getElementById('lat').value = pos.coords.latitude;
                document.getElementById('lon').value = pos.coords.longitude;
                document.getElementById('location').value = `GPS: ${pos.coords.latitude.toFixed(5)}, ${pos.coords.longitude.toFixed(5)}`;
            }, (err) => {
                alert("GPS failed: " + err.message);
            });
        }
    }

    document.getElementById('reportForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const submitBtn = document.getElementById('submitBtn');
        const loader = document.getElementById('loader');
        const resultBox = document.getElementById('result-box');
        
        submitBtn.style.display = 'none';
        loader.style.display = 'block';
        resultBox.style.display = 'none';

        const formData = new FormData(this);

        try {
            const response = await fetch('/api/v2/report', {
                method: 'POST',
                body: formData
            });
            const data = await response.json();
            
            loader.style.display = 'none';
            submitBtn.style.display = 'block';

            if (data.success) {
                resultBox.style.display = 'block';
                
                const species = data.wildlife_detection.species ? data.wildlife_detection.species.toUpperCase() : 'NO WILDLIFE DETECTED';
                const conf = data.wildlife_detection.confidence ? data.wildlife_detection.confidence : 'N/A';
                const loc = document.getElementById('location').value;
                
                document.getElementById('result-content').innerHTML = `
                    <div style="margin-bottom: 15px;">
                        <p><b>REPORT ID:</b> #${data.report_id}</p>
                        <p><b>Detected species:</b> ${species}</p>
                        <p><b>AI confidence:</b> ${conf}</p>
                        <p><b>Location:</b> ${loc}</p>
                        <p><b>Status:</b> PENDING</p>
                    </div>
                    
                    <div style="background: #ffeaa7; padding: 10px; border-radius: 5px; border: 1px solid #fdcb6e; font-size: 0.9em; font-weight: bold; color: #d63031;">
                        AI analysis is advisory. Reports may require verification by wildlife authorities.
                    </div>
                `;
                this.reset();
                document.getElementById('preview').style.display = 'none';
            } else {
                alert("Error: " + data.message);
            }
        } catch (err) {
            loader.style.display = 'none';
            submitBtn.style.display = 'block';
            alert("Submission failed. Please try again.");
        }
    });
</script>

</body>
</html>
